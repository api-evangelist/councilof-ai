summary: >-
  Council of AI's conformance profile is the agent-protocol and evidence-integrity stack rather than any
  enterprise identity standard: A2A v1.0 (JSON-RPC binding, live and probed), MCP 2025-06-18 (anonymous
  initialize + tools/list), x402 v2 payment challenges observed on the wire with a PAYMENT-REQUIRED header and a
  server-signed JWS offer (the x402 Offer & Receipt extension), an RFC 9727 API catalog, RFC 9116 security.txt,
  W3C did:web with Ed25519 JsonWebKey2020 keys, OpenAPI 3.1.0, a Content-Signal robots.txt, AG-UI SSE, and a
  Merkle public root with a published verification recipe. Absent: OAuth 2.0/OIDC discovery, RFC 9728, RFC 9457,
  RFC 8594. SCITT (RFC 9943) is declared PLANNED by the provider itself and is recorded as not conformed. The
  domain-standard signatures for this market (AI-governance measurement sold to agents) are the x402 extension
  keys inside the contract, the A2A extension URIs on the card, and the C2PA-manifest input on the Article 50
  tool — all declared by the provider's own machine documents, not by prose.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0'
  conforms: true
  evidence: >-
    a2a/councilof-ai-agent-card.json — supportedInterfaces[0] {url https://councilof.ai/api/a2a, protocolBinding
    JSONRPC, protocolVersion "1.0"}, capabilities object, skills[] of 8, application/a2a+json. POST GetTask with an
    unknown id returned -32001 TASK_NOT_FOUND with google.rpc.ErrorInfo; a 0.3 method name returned -32009
    VERSION_NOT_SUPPORTED. Graded conformant in a2a/councilof-ai-a2a.yml.
  domain_standard_signature: true
  note: The card declares three extension URIs (signed-receipts draft, x402 discovery, x402 Offer & Receipt) — the contract-level signature of agent commerce; none is required.
- id: mcp
  name: Model Context Protocol
  version: '2025-06-18'
  conforms: true
  evidence: 'POST https://councilof.ai/mcp initialize returned protocolVersion "2025-06-18", serverInfo {csoai-gspc-mcp, 1.4.2}; tools/list returned 13 tools with inputSchema (mcp/councilof-ai-mcp-tools.json). Listed on the MCP Registry as io.github.CSOAI-ORG/gspc 1.4.2.'
- id: json-rpc-2.0
  conforms: true
  evidence: Both /mcp and /api/a2a answer {"jsonrpc":"2.0", ...} with standard error objects.
- id: x402
  name: x402 HTTP payment protocol
  version: v2 (x402Version 2)
  conforms: true
  verification: observed-challenge
  evidence: >-
    GET https://councilof.ai/api/free-door returned HTTP 402 with a PAYMENT-REQUIRED header (base64 of the body)
    and a JSON body {x402Version 2, accepts[{scheme exact, network eip155:8453, asset 0x8335…2913 USDC, payTo
    0x2126…ae31, amount "0", maxTimeoutSeconds 300}]}; GET /api/request-attestation?subject=… and
    /api/proof?bundle=1 returned the same shape with amount "10000". The OpenAPI declares a top-level x-x402
    block, x-payment-info {protocols: [x402]} on 10 operations and the X402PaymentRequired / X402Accept schemas.
    Settlement itself was not exercised (no purchase made).
  domain_standard_signature: true
  spec_location: 'openapi: $.x-x402, $.paths[*].*.x-payment-info, $.components.schemas.X402PaymentRequired; discovery: /.well-known/x402.json'
- id: x402-offer-receipt
  name: x402 Offer & Receipt extension (v0.6), JWS profile
  conforms: true
  verification: partial
  evidence: >-
    The observed 402 on /api/free-door carried extensions["offer-receipt"].info.offers[0] = {format jws,
    acceptIndex 0, signature <compact JWS, alg EdDSA, kid did:web:csoai.org#board-attestation-1>}. Receipts
    (post-settlement) were not observed. The provider states eip712 is NOT emitted.
