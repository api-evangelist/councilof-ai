source: Derived by binding the LIVE tools/list of https://councilof.ai/mcp (13 tools with inputSchema, saved verbatim
  in mcp/councilof-ai-mcp-tools.json) to the operations of openapi/councilof-ai-public-api-openapi.yml (141 operations,
  verbatim source in openapi/_original/) and openapi/councilof-ai-gspc-read-surfaces-openapi.yml (7 operations,
  the /api/openapi.json the RFC 9727 api-catalog names). Every tool description names the HTTP surface it wraps,
  so most bindings are stated by the provider rather than inferred.
purpose: 'Make each MCP tool a first-class discovery unit bound to the REST operation that backs it. The three surfaces
  (REST OpenAPI, MCP, A2A) are overlapping projections of one measurement core: MCP exposes 13 tools over a 141-operation
  REST contract, A2A exposes 8 skills routed to fixed free handlers, and three MCP tools read static signed artefacts
  that no OpenAPI operation declares.'
surfaces:
  rest_openapi: openapi/councilof-ai-public-api-openapi.yml (141 operations, 112 paths, servers[] https://councilof.ai)
    + openapi/councilof-ai-gspc-read-surfaces-openapi.yml (7 read operations)
  mcp: https://councilof.ai/mcp — Streamable HTTP, anonymous initialize + tools/list (probed 2026-09-19, 200, protocolVersion
    2025-06-18, serverInfo csoai-gspc-mcp 1.4.2); stdio twin npm csoai-gspc-mcp 0.2.2
  a2a: https://councilof.ai/api/a2a — A2A v1.0 JSON-RPC, 8 skills (see a2a/councilof-ai-a2a.yml); not a tool surface,
    listed for completeness
  gated: 'None of the three surfaces requires authentication. Four MCP tools and ten REST doors are x402 PAYMENT-gated:
    called without x_payment / X-PAYMENT they return the HTTP 402 challenge (accepts[] with the amount), which is
    itself a free, observable response.'
