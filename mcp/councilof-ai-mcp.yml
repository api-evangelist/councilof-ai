tool_count: 13
free_tools: 9
paid_tools: 4
tools:
- {name: board_totals, category: board, paid: false, description: 'Live GSPC board totals from GET /api/gspc — slot count and measured count as two labelled numbers, plus as_of dates; UNREACHABLE is a distinct state.'}
- {name: get_axis, category: board, paid: false, inputs: [axis], description: 'One axis row (n, accuracy, interval, MEASURED/UNMEASURED, family, dates) from the live board.'}
- {name: verify_card, category: verification, paid: false, inputs: [card], description: 'Verify a signed gspc.measurement-card: recompute the id from the canonical body, check the Ed25519 signature under the PINNED key did:web:csoai.org#card-attestation-1.'}
- {name: list_cards, category: cards, paid: false, inputs: [axis, limit], description: 'The signed-card index (/signed/card_index.json) — declared n_cards vs rows carried, reported beside the /api/cards count, never reconciled.'}
- {name: get_root, category: public-root, paid: false, description: 'GET /root.json — merkle_root, card_count, as_of; VALID / UNREACHABLE / UNCHECKABLE.'}
- {name: get_card, category: public-root, paid: false, inputs: [sha256], description: 'One public-root card-v0 leaf by sha256 from /cards/{sha16}.json.'}
- {name: verify_inclusion, category: public-root, paid: false, inputs: [sha256], description: 'Merkle inclusion check via GET /api/proof?sha= — VALID / INVALID / UNCHECKABLE.'}
- {name: x402_trust, category: trust-snapshots, paid: false, description: 'Latest x402 catalog trust snapshot (counts of catalogued resources answering a correct 402 vs phantom).'}
- {name: mcp_trust, category: trust-snapshots, paid: false, description: 'Latest MCP handshake trust snapshot (/interop/mcp-trust/latest.json).'}
- {name: commission_card, category: x402-paid, paid: true, inputs: [subject, axis, x_payment], description: 'PAID (x402). Commission one signed card-v0 receipt for a named subject via /api/request-attestation; re-serves the signed cards on file; payment never mints a MEASURED cell.'}
- {name: art50_marking_evidence, category: x402-paid, paid: true, inputs: [url, bytes_b64, manifest_b64, preview, x_payment], description: 'PAID (x402 or CSOAI LTD invoice). EU AI Act Article 50 marking-evidence pack — C2PA manifest / IPTC digitalSourceType detectability; preview=true is a free unsigned measurement.'}
- {name: rwa_evidence, category: x402-paid, paid: true, inputs: [asset, preview, x_payment], description: 'PAID (x402). Signed evidence card of one XRPL issued asset''s on-ledger state; preview=true free.'}
- {name: receipts_batch, category: x402-paid, paid: true, inputs: [from, to, preview, x_payment], description: 'PAID (x402 or invoice). Historical batch of the estate''s measurement receipts with Merkle inclusion paths; preview=true free.'}
protocol_methods:
  implemented: [initialize, tools/list, tools/call]
  not_probed: [resources/list, prompts/list]
notes:
- The provider also publishes /api/mcp and /api/tools — its OWN probe registry of MCP servers (probe_host a developer laptop, probe_finished 2026-08-27) that still lists a four-tool 'measure / verify / jail-probe / enter-arena' shape the manifests say was dropped. The live tools/list above is authoritative; those endpoints are historical self-measurement, not the server contract.
- Payment amounts appear only inside a 402 challenge (observed 2026-09-19 on GET /api/request-attestation and /api/proof?bundle=1 — 10000 atomic USDC, i.e. 0.01 USDC, under a dated launch campaign with normal 20000). No purchase was made.
