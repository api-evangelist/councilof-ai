summary: >-
  CSOAI Ltd (Council of AI) operates ONE remote MCP server at https://councilof.ai/mcp on the same host as its
  website, OpenAPI and A2A endpoint, with a stdio twin published to npm as csoai-gspc-mcp. The remote door is
  Streamable HTTP: a GET returns a self-describing JSON document (server csoai-gspc-mcp 1.4.2, release_train
  pages-http, install recipes, the four paid tool names), and anonymous POST initialize / tools/list both
  answered 200 as text/event-stream (protocolVersion 2025-06-18, capabilities.tools.listChanged false,
  serverInfo csoai-gspc-mcp 1.4.2) with 13 tools carrying real inputSchemas. Nine tools are free readers of the
  GSPC board, the signed-card index and the public Merkle root; four are x402-metered evidence tools that,
  called without the x_payment argument, return the route's HTTP 402 challenge as structuredContent. No
  account, API key or OAuth is involved anywhere; the server card states authentication.required false and no
  RFC 8414/9728 metadata is served. The tool names and doctrine ("measurement, never certification"; VALID /
  INVALID / UNCHECKABLE) are provider-specific — this is a provider-built server, not a platform-generated one.
deployment:
  mode: both
  endpoint: https://councilof.ai/mcp
  install: npx -y csoai-gspc-mcp
  package: https://www.npmjs.com/package/csoai-gspc-mcp
  auth: none
  verified: probed
  note: >-
    Remote: a hosted HTTPS endpoint an MCP client POSTs to directly (GET /mcp says "Add https://councilof.ai/mcp
    as a Streamable HTTP MCP server"). Local: "claude mcp add gspc -- npx -y csoai-gspc-mcp" (verbatim from GET
    /mcp install.claude_code); npm csoai-gspc-mcp latest 0.2.2 published 2026-09-13, zero runtime dependencies.
    The provider's own manifests pin "npx -y csoai-gspc-mcp@0.2.1" while npm's latest is 0.2.2. The stdio
    package and the Pages HTTP implementation are released independently and the provider says to ask each
    installed version for its own tools/list. auth is none in the connection sense; four tools are gated by
    x402 payment (HTTP 402 challenge, USDC on Base eip155:8453), which is an economic gate on invocation, not
    an authentication scheme.
