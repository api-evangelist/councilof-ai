    apex is green." Not probed with POST.
  transport: streamable-http
  http_methods: [GET, POST]
  auth: none
  payment: x402 v2 — USDC (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913) on Base (eip155:8453), payTo 0x212686404A7D1E1fD88F35eD6200c3aF7A78ae31; the X-PAYMENT value travels as the x_payment tool ARGUMENT
