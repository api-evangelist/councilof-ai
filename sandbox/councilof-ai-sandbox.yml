summary: >-
  There is no separate test environment and no test-mode key: production is the sandbox, and every free read is
  already production data. What the provider publishes instead is a rehearsal path for the one thing that
  costs money — an x402 purchase: (1) every paid door answers a free 402 challenge that itself carries a free
  preview of the deliverable; (2) preview=true / omitting bundle=1 returns an unsigned free version of the
  artefact; (3) GET /api/free-door is a real x402 route priced at zero so a wallet can settle end-to-end and
  charge nothing. The dedicated /api/sandbox endpoint is declared retired ("sandbox — retired until its response
  can be derived from current evidence"), and the provider states that its own wallets' payments are recorded
  as self-tests and never counted as buyers.
test_vs_live:
  separate_environment: false
  key_prefixes: not applicable — no keys are issued
  test_network: none — x402 settles on Base MAINNET (eip155:8453); the zero-amount door is the rehearsal, not a testnet
  note: One host, no credentials. Keyless reads are live data.
