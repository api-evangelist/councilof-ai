agent_card:
  name: Council of AI — Measurement Agent
  description: >-
    Independent AI-governance MEASUREMENT body. Publishes the living GSPC board (Governance · Safety ·
    Provenance · Continuity) with frozen item banks, published scoring code, and an Ed25519-signed board.
    Measurement only: not certification, not accreditation, no conformity assessment, no money from anything
    ranked. A2A v1.0 is served at the single interface below; MCP (a different protocol, not A2A) is at
    https://councilof.ai/mcp.
  version: 1.1.0
  protocol_version: '1.0'
  protocol_version_location: supportedInterfaces[0].protocolVersion (the A2A v1.0 card shape; there is no top-level protocolVersion, url or preferredTransport field in v1.0)
  interfaces:
  - {url: 'https://councilof.ai/api/a2a', protocolBinding: JSONRPC, protocolVersion: '1.0'}
  provider:
    organization: CSOAI Ltd
    url: https://councilof.ai
  documentation_url: https://councilof.ai/llms.txt
  icon_url: https://councilof.ai/og-image.png
  capabilities:
    streaming: false
    push_notifications: false
    extended_agent_card: false
    extensions:
    - uri: https://councilof.ai/a2a/extensions/signed-receipts/v1/
      required: false
      note: Provider-authored draft extension (Ed25519 task-outcome receipts, did:web key trust); the card itself says it is declared but NOT yet emitted.
    - uri: https://councilof.ai/.well-known/x402.json
      required: false
      note: x402 discovery index for the agent pay rail; free door amount 0 at /api/free-door; settlement on Base mainnet.
    - uri: https://github.com/x402-foundation/x402/blob/69652a69798f0b08f95bef33318896e36e210f7e/specs/extensions/extension-offer-and-receipt.md
      required: false
      note: x402 Offer & Receipt extension (JWS/EdDSA, kid did:web:csoai.org#board-attestation-1) — conditionally emitted.
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain, application/json]
  security_schemes: null
  security: null
  skill_count: 8
  skills:
