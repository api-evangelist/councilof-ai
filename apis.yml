- aid: councilof-ai:council-of-ai-measurement-agent-a2a
  name: Council of AI Measurement Agent (A2A)
  description: 'Agent2Agent v1.0 surface: an agent card served from https://councilof.ai/.well-known/agent-card.json
    (application/a2a+json, version 1.1.0, supportedInterfaces[0] JSONRPC 1.0 at https://councilof.ai/api/a2a) advertising
    eight skills — signed GSPC board, East-West crosswalk, measured badge, benchmark-quality register, Article 50
    provenance detection, EU AI Act screening helper, x402 discovery + free door, estate index — routed to fixed
    free handlers. Streaming, push notifications and the extended card are declared false; GetTask on an unknown
    id returns -32001 TASK_NOT_FOUND and 0.3 method names return -32009. Three extension URIs are declared (signed-receipts
    draft, x402 discovery, x402 Offer & Receipt), none required. Listed on a2aregistry.org.'
  humanURL: https://councilof.ai/llms.txt
