apis:
- aid: councilof-ai:council-of-ai-gspc-mcp-server
  name: Council of AI GSPC MCP Server
  description: >-
    Remote Model Context Protocol server at https://councilof.ai/mcp (Streamable HTTP, protocol 2025-06-18,
    serverInfo csoai-gspc-mcp 1.4.2) with a stdio twin on npm (csoai-gspc-mcp 0.2.2, "npx -y csoai-gspc-mcp").
    Anonymous initialize and tools/list return 13 tools with real inputSchemas: nine free readers (board
    totals, one axis, verify a signed card, list cards, public root, one leaf, inclusion proof, x402 and
    MCP trust snapshots) and four x402-metered evidence tools (commission_card, art50_marking_evidence,
    rwa_evidence, receipts_batch) that return the 402 challenge as structuredContent until called with
    x_payment. Listed on the MCP Registry as io.github.CSOAI-ORG/gspc 1.4.2 and on Smithery; manifests
    at /.well-known/mcp.json and /.well-known/mcp/server-card.json; no OAuth metadata — authentication.required
    false.
  humanURL: https://councilof.ai/connect-gspc/
  baseURL: https://councilof.ai/mcp
  tags:
  - MCP
  - Agent-Native
  - AI Governance
  - x402
  tags_raw:
  - MCP
  - agent-native
  - AI Governance
  - x402
