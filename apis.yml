apis:
- aid: councilof-ai:council-of-ai-public-api
  name: Council of AI Public API
  description: 'Keyless REST API for the GSPC measurement estate: the living board (GET /api/gspc, one axis via
    ?axis=), the quotable live state, axis register, methodology, signed-card and commission indexes, public root
    and Merkle inclusion proofs, corrections and press feeds, an Article 50 C2PA-marking detector, XRPL asset evidence,
    and ten x402-metered doors (request-attestation, proof bundle, evidence-bundle, eunomia-data, rwa/evidence,
    wrapper, art50/marking-evidence, feeds/provider-diff, receipts/batch, free-door at amount 0) that answer HTTP
    402 with the price and a signed offer until paid in USDC on Base. 141 operations across 112 paths, OpenAPI 3.1.0,
    servers[] https://councilof.ai, CC-BY-4.0; 34 operations carry an x-csoai-lifecycle marker (quarantined / not
    implemented). A second, read-only 7-operation spec is served at /api/openapi.json.'
