  causes:
  - A metered door called without an X-PAYMENT header (REST) or x_payment argument (MCP).
  remediation: Read accepts[0] (scheme exact, network eip155:8453, asset USDC, payTo, amount in atomic units, maxTimeoutSeconds
    300), settle from your own wallet via an x402 client, retry the same URL with the payment header. The csoai.free_preview
    / preview=true path is free. A 402 is not delivery. Amounts appear ONLY here, never in docs.
  verification: extensions["offer-receipt"].info.offers[] carries a JWS (EdDSA, kid did:web:csoai.org#board-attestation-1)
    you can verify against https://csoai.org/.well-known/did.json before paying.
