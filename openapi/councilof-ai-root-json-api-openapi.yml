openapi: 3.2.0
info:
  title: Councilof Ai Root.json API
  version: 0.1.0
  contact:
    name: CSOAI Ltd
    url: https://councilof.ai
    email: nicholas@csoai.org
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Root.json across 2 of this provider''s published API definitions: councilof-ai-gspc-read-surfaces-openapi.json, councilof-ai-gspc-read-surfaces-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://councilof.ai
tags:
- name: Root.json
paths:
  /root.json:
    get:
      operationId: getRoot
      summary: The last published public root (csoai.public-root/v1)
      description: 'Ed25519-signed envelope under did:web:csoai.org#board-attestation-1; card_sha256[] is bound by merkle_root. Recipe: /signed/HOW-TO-VERIFY-ROOT.md. Not a certificate.'
      responses:
        '200':
          description: Root envelope.
      tags:
      - Root.json
    servers:
    - url: https://councilof.ai
x-refined-from:
- councilof-ai-gspc-read-surfaces-openapi.json
- councilof-ai-gspc-read-surfaces-openapi.yml
