components:
  schemas:
    X402Accept:
      properties:
        amount:
          description: atomic units (x402 v2)
          pattern: ^[0-9]+$
          type: string
        asset:
          const: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          description: USDC contract, 6 decimals
          type: string
        extra:
          description: EIP-712 domain of the asset
          properties:
            name:
              type: string
            version:
              type: string
          type: object
        maxAmountRequired:
          description: atomic units (x402 v1 name for the same figure)
          pattern: ^[0-9]+$
          type: string
        maxTimeoutSeconds:
          type: integer
        network:
          const: eip155:8453
          description: CAIP-2
          type: string
        payTo:
          const: '0x212686404A7D1E1fD88F35eD6200c3aF7A78ae31'
          type: string
        scheme:
          const: exact
          type: string
      required:
      - scheme
      - network
      - asset
      - payTo
      - amount
      - maxTimeoutSeconds
      type: object
    X402PaymentRequired:
      properties:
        accepts:
          items:
            $ref: '#/components/schemas/X402Accept'
          minItems: 1
          type: array
        error:
          type: string
        extensions:
          description: extensions.bazaar carries info.input (a sample request) and schema (input/output JSON Schema). extensions['offer-receipt'].info.offers[] carries one server-signed offer per accepts[] entry, format 'jws' — a compact EdDSA JWS whose payload is the offer (x402 Offer & Receipt extension §4.1). It is present only when the edge holds its signing key; csoai.offer_receipt.signed says which, and why, on every 402.
          properties:
            offer-receipt:
              properties:
                info:
                  properties:
                    offers:
                      items:
                        properties:
                          acceptIndex:
                            description: unsigned convenience field; match offers to accepts[] by payload fields, never by index (§4.1.1)
                            type: integer
                          format:
                            const: jws
                            type: string
                          signature:
                            description: JWS compact serialization containing the offer payload
                            type: string
                        required:
                        - format
                        - signature
                        type: object
                      type: array
                  type: object
              type: object
          type: object
        resource:
          properties:
            description:
              type: string
            mimeType:
              type: string
            serviceName:
              type: string
            tags:
              items:
                type: string
              type: array
            url:
              type: string
          type: object
        x402Version:
          const: 2
          type: integer
      required:
      - x402Version
      - accepts
      type: object
  securitySchemes:
    ed25519:
      description: Ed25519 signature of canonical body, under did:web:csoai.org#card-attestation-1
      in: header
      name: X-CSOAI-Signed-Card
      type: apiKey
    githubOidc:
      bearerFormat: JWT
      description: GitHub Actions OIDC token satisfying the handler's issuer, audience, repository and workflow checks.
      scheme: bearer
      type: http
    operatorBearer:
      description: Operation-specific configured operator or writer credential. Not interchangeable across operations.
      scheme: bearer
      type: http
x-x402:
  amounts: only inside each resource's 402 challenge (accepts[].amount) — never on this catalog, never in prose
  asset:
    contract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
    decimals: 6
    symbol: USDC
  catalog: https://councilof.ai/api/x402
  doors:
  - /api/free-door
  - /api/discover/chainlink
  - /api/discover/ondo
  - /api/discover/ondo-ousg
  - /api/request-attestation
  - /api/evidence-bundle
  - /api/signed-data-feed
  - /api/proof
  - /api/rwa/evidence
  - /api/wrapper
  - /api/wrapper/changes
  - /api/wrapper/asset/usdc
  - /api/wrapper/asset/usdt
  - /api/wrapper/asset/dai
  - /api/art50/marking-evidence
  - /api/feeds/provider-diff
  - /api/receipts/batch
  - /api/measurement/fresh-capsule
  - /api/pop/stablecoins
  - /api/pop/swift
  - /api/pop/xrpl
  - /api/pop/x402-bazaar
  - /api/pop/mcp-registry
  - /api/pop/a2a
  - /api/pop/ots-proofs
  - /api/pop/layer0
  - /api/pop/corrections
  - /api/pop/claim-watch
  - /api/ras/mcp-probe
  - /api/ras/x402-check
  - /api/ras/supply
  facilitator:
    configured: true
    note: the facilitator URL is a Cloudflare Pages env var (X402_FACILITATOR_URL) that no public surface publishes; /api/x402 reports only whether one is configured
    url: null
  mcp: https://councilof.ai/mcp
  mode: live
  mode_note: A settled receipt (facilitator /verify then /settle) unlocks the paid artefact. Verification of every artefact stays free.
  network: eip155:8453
  not:
  - score
  - certificate
  - filled-cells
  - pay-to-pass
  - rank
  offer_receipt:
    alg: EdDSA
    did_document: https://csoai.org/.well-known/did.json
    formats_emitted:
    - jws
    formats_not_emitted:
    - eip712
    kid: did:web:csoai.org#board-attestation-1
    receipts_by_payer: https://councilof.ai/api/receipts?payer=0x…
    spec: https://github.com/x402-foundation/x402/blob/69652a69798f0b08f95bef33318896e36e210f7e/specs/extensions/extension-offer-and-receipt.md
    spec_commit: 69652a69798f0b08f95bef33318896e36e210f7e
    supported: true
    verify_hosted: https://councilof.ai/api/receipts/verify
