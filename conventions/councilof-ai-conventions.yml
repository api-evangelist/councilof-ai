api_style: REST over HTTPS, JSON responses, GET-dominant (107 of 141 operations are GET); plus JSON-RPC 2.0 on /mcp (MCP) and /api/a2a (A2A) and SSE on /api/agui/gspc-state
media_type: application/json
auth:
  style: >-
    Anonymous by default — "Public · keyless · CORS-open … No account, no API key, no tiers … Auth: none"
    (api-docs). The three declared securitySchemes guard five provider-internal write doors. Metered artefacts
    are unlocked by x402 payment, not by identity.
  detail: authentication/councilof-ai-authentication.yml
cors:
  allow_origin: '*'
  observed: access-control-allow-origin:* on GET /api/gspc, /api/x402 and the 402 challenges
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: undocumented
  description: >-
    No Idempotency-Key header, parameter or body field exists on any of the 34 non-GET operations and none is
    documented. The public surface is overwhelmingly read-only; the paid doors are GETs whose side effect is a
    settlement, and replay protection there is on the PAYMENT: the privacy notice states settled transaction
    hashes are stored (settled:tx:*) with the lawful basis "preventing a payment being replayed", and each x402
    authorisation is single-use on chain ("settled_usdc … single-use"). That protects the rail from a replayed
    payment; it does not give a client a documented safe-retry contract for an ambiguous outcome.
  gaps:
  - No idempotency key on POST /api/webhooks (create), POST /api/contact, POST /api/lead, POST /api/evidence-intake or the operator write doors.
  - No documented client guidance for a timed-out paid GET (whether a second settlement buys a second artefact).
dry_run_mode:
  supported: true
  status: documented
  mechanism: free preview on every paid door
  surfaces:
  - 'preview=true (art50_marking_evidence, rwa_evidence, receipts_batch — "free unsigned measurement / state / count") — declared in the MCP inputSchemas and the 402 body''s csoai.free_preview'
  - 'omit bundle=1 (x402_proof, x402_evidence_bundle) — llms.txt: "Free preview: omit bundle=1 or add preview=1 as the 402 body documents"'
  - 'GET /api/free-door — a live 402 route priced at zero that "settles, charges nothing; proves the rail"'
  - 'the 402 challenge itself is a free rehearsal: GET /api/request-attestation?subject=<id> returns csoai.preview with the signed cards already on file, free'
  note: The dedicated /api/sandbox operation is declared QUARANTINED_PRE_RELEASE (503); see sandbox/councilof-ai-sandbox.yml.
