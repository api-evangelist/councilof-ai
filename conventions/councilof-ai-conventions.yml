reversibility:
  status: documented
  credit_note: >-
    A reversal operation exists in the contract (POST /api/refund — "record a refund or chargeback and revoke
    entitlement + cert") but no reversal WINDOW is stated anywhere for x402 purchases, so this grades
    documented (0.4), not verified. No window is asserted here because none is published.
  write_surface_summary: 34 non-GET operations; 10 x402-metered GET doors whose side effect is an on-chain settlement
  surfaces:
  - surface: x402 door purchases (request-attestation, proof bundle, evidence-bundle, eunomia-data, rwa/evidence, wrapper, art50/marking-evidence, feeds/provider-diff, receipts/batch)
    reversal_operation: post__api_refund (declared; caller and preconditions unstated)
    window: not stated
    finality_note: >-
      Settlement is on Base mainnet in USDC; /api/revenue: "Chain adjudicates, not the CRM." The privacy notice
      says the transaction hash and payer are public on chain "whatever we do". Terms §10–11 disclaim outcomes
      and cap liability at fees paid in 12 months. Pre-purchase safeguards are strong instead: the 402 carries a
      free preview, a signed offer (verifiable offline) and "fresh_compute_excluded" pricing metadata, and the
      free door lets a client rehearse settlement at amount 0.
    docs: https://councilof.ai/quickstart/
  - surface: POST /api/webhooks (create)
    reversal_operation: delete__api_webhooks (DELETE /api/webhooks?id=<id>)
    window: not stated (no restore after delete documented)
  - surface: POST /api/contact, POST /api/lead, POST /api/evidence-intake (submissions)
    reversal_operation: none in the contract; the privacy notice offers erasure on request ("deleted on a valid erasure request where no exemption applies", answered within one calendar month)
    window: not stated
  - surface: Published measurement results
    reversal_operation: dispute / re-measurement (https://councilof.ai/dispute/ — "the answer is always a re-measurement, never a defence"; corrections are appended, never edited)
    window: none stated; free and open to anyone with standing
  read_only_surfaces: GSPC board, signed cards, root, proofs, feeds, MCP free tools and A2A skills are read-only — reversibility na for them.
  docs: https://councilof.ai/dispute/
