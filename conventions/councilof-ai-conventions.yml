three_state_semantics:
  note: >-
    A cross-cutting convention every surface repeats: verification answers are VALID / INVALID / UNCHECKABLE
    and a board cell is MEASURED / UNMEASURED; "UNCHECKABLE" (could not check) is never collapsed into
    "INVALID", an unmeasured axis is "a first-class answer — never an error and never a zero", and counts are
    to be quoted by field path from the live payload, never frozen in prose. Clients should model these enums
    explicitly.
