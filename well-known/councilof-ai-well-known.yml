summary:
  hosts_probed: 3
  paths_probed: 27
  documents_served: 13
  note: >-
    A dense, real well-known surface. councilof.ai serves an A2A agent card (application/a2a+json, on both the
    canonical and the legacy path), an RFC 9116 security.txt with Contact/Expires/Canonical/Policy, an RFC 9727
    API catalog (application/linkset+json; profile RFC 9727) that links the OpenAPI, the MCP server card, the
    agent card and the x402 catalog, a /.well-known/mcp.json server manifest plus /.well-known/mcp/server-card.json,
    an x402 v2 discovery index and a hand-authored RFC 9943 SCITT discovery profile that states
    implementation_status PLANNED. No OAuth 2.0 / OIDC discovery and no RFC 9728 protected-resource metadata
    on any host — the MCP server and A2A endpoint are anonymous, and the paid tools are gated by x402 payment
    rather than by an authorization server. csoai.org (the company's second domain, did:web:csoai.org) serves
    the did.json key document the cards are verified against, its own security.txt, an ai-plugin.json, an
    api-catalog (served as application/octet-stream) and an older, different agent card.
  pointer_basis: >-
    WellKnown pointer emitted on the strength of 13 served documents; SecurityTxt pointer emitted because
    /.well-known/security.txt is a real RFC 9116 document on two hosts.
  false_positive_watch: >-
    Unknown /.well-known/* and other non-API paths on councilof.ai return HTTP 404 with a 13,951-byte HTML
    page, so a 200 here is a served document, not a catch-all. The site's own correction ledger
    (C-2026-0917-02) records that until 17 September 2026 every URL answered 403 to non-browser clients
    (Cloudflare Browser Integrity Check); re-probed with python-requests and default curl user agents on
    2026-09-20, both now receive 200.
